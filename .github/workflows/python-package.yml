name: Python package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Create minimal test if none exist
        run: |
          mkdir -p tests
          touch tests/__init__.py
          if [ ! -f tests/test_scripts.py ]; then
            cat > tests/test_scripts.py << 'EOF'
import ast, pathlib

def test_scripts_are_valid_python():
    scripts = list(pathlib.Path(".").glob("*.py"))
    assert scripts, "No Python scripts found"
    for s in scripts:
        ast.parse(s.read_text(encoding="utf-8"))
EOF
          fi

      - name: Run tests
        run: pytest tests/
