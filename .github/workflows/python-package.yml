name: Python package

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Create test suite
        run: |
          mkdir -p tests
          touch tests/__init__.py
          printf 'import ast\nimport pathlib\n\ndef test_scripts_are_valid_python():\n    scripts = list(pathlib.Path(".").glob("*.py"))\n    assert scripts, "No Python scripts found"\n    for s in scripts:\n        ast.parse(s.read_text(encoding="utf-8"))\n' > tests/test_scripts.py

      - name: Run tests
        run: pytest tests/
